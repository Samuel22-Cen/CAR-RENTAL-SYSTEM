<!DOCTYPE html>
<html>
<head>
  <title>Admin - Bookings</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="theme.css">

  <!-- Theme apply -->
  <script>
  (function() {
    const theme = localStorage.getItem("adminTheme") || "default";
    document.addEventListener("DOMContentLoaded", () => {
      if (theme === "dark") document.body.classList.add("dark-mode");
      if (theme === "light") document.body.classList.add("light-mode");
    });
  })();
  </script>


  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Your Firebase config -->
  <script src="firebase.js"></script>

  <!-- Security system -->
  <script src="security.js"></script>
  <script src="admin_shared.js"></script>


  <!-- Protect admin page AFTER Firebase loads -->
  <script>
      Security.protectAdminPage();
  </script>
</head>

<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a href="admin.html">Dashboard</a>
  <a href="admin_bookings.html" class="active">Bookings</a>
  <a href="admin_users.html">Users</a>
  <a href="admin_cars.html">Cars</a>
  <a href="admin_revenue.html">Revenue</a>
  <a href="admin_settings.html">Settings</a>

  <a href="admin_notifications.html" class="notif-btn">
    <span class="notif-icon">🔔</span>
    Notifications
    <span id="notif-badge" class="notif-badge">0</span>
  </a>

  <a class="signout-btn" onclick="signOut()">Sign Out</a>
</div>

<div class="content">
  <h1>Manage Bookings</h1>
  <table id="bookingsTable"></table>
</div>

<!-- Admin logic -->
<script src="admin.js"></script>

<script>

function signOut() {
  firebase.auth().signOut().then(() => {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
  });
}

function updateAdminNotifBadge() {
  db.collection("notifications")
    .where("for", "==", "admin")
    .onSnapshot(snapshot => {
      let el = document.getElementById("notif-badge");
      if (!el) return;
      let count = 0;
      snapshot.forEach(doc => {
        if (doc.data().status === "unread") count++;
      });
      el.textContent = count;
      el.style.display = count === 0 ? "none" : "inline-block";
    });
}

function loadBookings() {
  db.collection("bookings").onSnapshot(snapshot => {
    let table = document.getElementById("bookingsTable");

    if (snapshot.empty) {
      table.innerHTML = "<tr><td>No bookings yet.</td></tr>";
      return;
    }

    let rows = `
      <tr>
        <th>User</th>
        <th>Car</th>
        <th>Start</th>
        <th>End</th>
        <th>Total</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    `;

    snapshot.forEach(doc => {
      let b = doc.data();
      let id = doc.id;
      rows += `
        <tr>
          <td>${b.email || b.user || "Unknown"}</td>
          <td>${b.carName}</td>
          <td>${b.start}</td>
          <td>${b.end}</td>
          <td>$${b.total}</td>
          <td><span class="status ${b.status}">${b.status}</span></td>
          <td>
            <button onclick="updateBooking('${id}', 'accepted', '${b.email}', '${b.carName}', '${b.start}', '${b.end}', ${b.total})">Accept</button>
            <button onclick="updateBooking('${id}', 'cancelled', '${b.email}', '${b.carName}', '${b.start}', '${b.end}', ${b.total})">Cancel</button>
          </td>
        </tr>
      `;
    });

    table.innerHTML = rows;
  });
}

async function updateBooking(id, newStatus, email, carName, start, end, total) {
  await db.collection("bookings").doc(id).update({ status: newStatus });

  let message = newStatus === "accepted"
    ? `Your booking for ${carName} from ${start} to ${end} was approved. Total: $${total}`
    : `Your booking for ${carName} from ${start} to ${end} was cancelled.`;

  await db.collection("notifications").add({
    for: "customer",
    userEmail: email,
    message: message,   // ⭐ REQUIRED FIELD
    type: newStatus === "accepted" ? "booking_accepted" : "booking_cancelled",
    carName: carName,
    start: start,
    end: end,
    total: total,
    status: "unread",
    createdAt: Date.now()
  });
}



loadBookings();
updateAdminNotifBadge();

</script>

</body>
</html>

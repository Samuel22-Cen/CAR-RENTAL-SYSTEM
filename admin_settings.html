<!DOCTYPE html>
<html>
<head>
  <title>Admin Settings</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="theme.css">

  <!-- Theme apply -->
  <script>
  (function() {
    const theme = localStorage.getItem("adminTheme") || "default";
    document.addEventListener("DOMContentLoaded", () => {
      if (theme === "dark") document.body.classList.add("dark-mode");
      if (theme === "light") document.body.classList.add("light-mode");
    });
  })();
  </script>


  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase.js"></script>
  <script src="security.js"></script>
  <script src="admin_shared.js"></script>
  <script>Security.protectAdminPage();</script>

  <style>
    .content {
      flex: 1;
      padding: 20px;
      background: #f1f5f9;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .content h1 {
      font-size: 28px;
      color: #1e3a8a;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
    }

    .settings-card {
      background: white;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.07);
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
    }

    .settings-card.full-width {
      grid-column: 1 / -1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e3a8a;
      margin: 0 0 20px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title.danger { color: #dc2626; }

    .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .icon.blue { background: #eff6ff; }
    .icon.green { background: #f0fdf4; }
    .icon.red { background: #fef2f2; }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      color: #1e293b;
      background: #f8fafc;
      outline: none;
      transition: 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3b82f6;
      background: white;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    .save-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
    }

    .save-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(59,130,246,0.35);
    }

    .danger-zone {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 5px;
    }

    .danger-btn {
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .danger-btn.soft {
      background: #fef2f2;
      color: #dc2626;
      border: 1.5px solid #fecaca;
    }

    .danger-btn.soft:hover {
      background: #fee2e2;
      transform: translateY(-1px);
    }

    .danger-btn.hard {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      grid-column: 1 / -1;
    }

    .danger-btn.hard:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(220,38,38,0.35);
    }

    .admin-name {
      color: white;
      font-weight: bold;
      margin-top: -10px;
      margin-bottom: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
<div class="sidebar">
  <h2>Admin Panel</h2>
  <p id="adminDisplayName" class="admin-name">👤 Admin</p>
  <a href="admin.html">Dashboard</a>
  <a href="admin_bookings.html">Bookings</a>
  <a href="admin_users.html">Users</a>
  <a href="admin_cars.html">Cars</a>
  <a href="admin_revenue.html">Revenue</a>
  <a href="admin_settings.html" class="active">Settings</a>
  <a href="admin_notifications.html">Notifications</a>
  <a class="signout-btn" onclick="signOut()">Sign Out</a>
</div>

<div class="content">
  <h1>⚙️ Settings</h1>

  <div class="settings-grid">

    <div class="settings-card">
      <h2 class="card-title">
        <span class="icon blue">👤</span> Profile
      </h2>
      <div class="form-group">
        <label>Admin Name</label>
        <input type="text" id="adminName" placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="adminEmail" placeholder="Enter your email" readonly>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="adminPassword" placeholder="Leave blank to keep current">
      </div>
      <button class="save-btn" onclick="saveProfile()">💾 Save Profile</button>
    </div>

    <div class="settings-card">
      <h2 class="card-title">
        <span class="icon green">🎨</span> Theme
      </h2>
      <div class="form-group">
        <label>Select Theme</label>
        <select id="themeSelect">
          <option value="default">Default Blue</option>
          <option value="light">Light Mode</option>
          <option value="dark">Dark Mode</option>
        </select>
      </div>
      <button class="save-btn" onclick="applyTheme()">🎨 Apply Theme</button>
    </div>

    <div class="settings-card full-width">
      <h2 class="card-title danger">
        <span class="icon red">⚠️</span> Danger Zone
      </h2>
      <div class="danger-zone">
        <button class="danger-btn soft" onclick="clearCollection('bookings')">🗑️ Clear All Bookings</button>
        <button class="danger-btn soft" onclick="clearCollection('notifications')">🔕 Clear All Notifications</button>
        <button class="danger-btn soft" onclick="clearCollection('users')">👥 Clear All Users</button>
        <button class="danger-btn soft" onclick="clearCollection('cars')">🚗 Clear All Cars</button>
        <button class="danger-btn hard" onclick="clearAll()">💥 Clear EVERYTHING</button>
      </div>
    </div>

  </div>
</div>

<script src="admin.js"></script>
<script>
function signOut() {
  firebase.auth().signOut().then(() => {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
  });
}

function loadProfile() {
  const loggedUser = JSON.parse(localStorage.getItem("loggedInUser"));
  if (!loggedUser) return;
  document.getElementById("adminName").value = loggedUser.name || "";
  document.getElementById("adminEmail").value = loggedUser.email || "";
  document.getElementById("adminDisplayName").textContent = "👤 " + (loggedUser.name || "Admin");
}

async function saveProfile() {
  const name = document.getElementById("adminName").value.trim();
  const password = document.getElementById("adminPassword").value;
  const loggedUser = JSON.parse(localStorage.getItem("loggedInUser"));
  if (!loggedUser) return;

  try {
    await db.collection("users").doc(loggedUser.uid).update({ name: name });
    loggedUser.name = name;
    localStorage.setItem("loggedInUser", JSON.stringify(loggedUser));
    if (password) await firebase.auth().currentUser.updatePassword(password);
    document.getElementById("adminDisplayName").textContent = "👤 " + name;
    alert("✅ Profile saved successfully!");
  } catch (err) {
    alert("Error: " + err.message);
  }
}

function applyTheme() {
  const theme = document.getElementById("themeSelect").value;
  localStorage.setItem("adminTheme", theme);
  setTheme();
  alert("✅ Theme applied!");
}

function setTheme() {
  const theme = localStorage.getItem("adminTheme") || "default";
  document.body.classList.remove("light-mode", "dark-mode");
  if (theme === "light") document.body.classList.add("light-mode");
  if (theme === "dark") document.body.classList.add("dark-mode");
  if (document.getElementById("themeSelect")) {
    document.getElementById("themeSelect").value = theme;
  }
}

async function clearCollection(collectionName) {
  if (!confirm(`Are you sure you want to delete ALL ${collectionName}?`)) return;
  try {
    const snapshot = await db.collection(collectionName).get();
    const batch = db.batch();
    snapshot.forEach(doc => batch.delete(doc.ref));
    await batch.commit();
    alert(`✅ All ${collectionName} cleared!`);
  } catch (err) {
    alert("Error: " + err.message);
  }
}

async function clearAll() {
  if (!confirm("⚠️ This will delete ALL data. Are you absolutely sure?")) return;
  try {
    await clearCollection("bookings");
    await clearCollection("notifications");
    await clearCollection("users");
    await clearCollection("cars");
    localStorage.clear();
    alert("✅ All data cleared!");
    window.location.href = "index.html";
  } catch (err) {
    alert("Error: " + err.message);
  }
}

loadProfile();
setTheme();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="theme.css">
   <script>
  (function() {
    const theme = localStorage.getItem("adminTheme") || "default";
    document.addEventListener("DOMContentLoaded", () => {
      if (theme === "dark") document.body.classList.add("dark-mode");
      if (theme === "light") document.body.classList.add("light-mode");
    });
  })();
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Car Booking</title>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Firebase SDKs (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="firebase.js"></script>
  <script src="security.js"></script>

  <script>
    if (typeof Security !== "undefined" && Security.protectCustomerPage) {
      Security.protectCustomerPage();
    } else {
      setTimeout(() => {
        if (typeof Security !== "undefined" && Security.protectCustomerPage) {
          Security.protectCustomerPage();
        }
      }, 200);
    }
  </script>

  <style>
    :root{
      --blue-1:#007bff; --accent:#28a745; --danger:#ff4d4d;
      --card-bg:#fff; --shadow:0 8px 20px rgba(0,0,0,0.2);
    }
    *{box-sizing:border-box;transition:0.25s ease}
    body{
      font-family:'Segoe UI',Arial,sans-serif;
      margin:0;
      background:linear-gradient(135deg,#007bff,#00c6ff);
      color:#333;
      min-height:100vh;
    }
    .container{
      max-width:800px;
      margin:50px auto;
      background:var(--card-bg);
      padding:30px;
      border-radius:12px;
      box-shadow:var(--shadow);
    }
    h1{color:var(--blue-1);margin-bottom:10px;text-align:center}
    .car-info{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}
    .car-info div{background:#f9f9f9;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
    label{display:block;margin-top:15px;font-weight:bold;color:#444}
    #startDate,#endDate{
      width:100%;padding:12px 14px;font-size:16px;
      border:2px solid #e0e0e0;border-radius:10px;
      background:#f9f9f9;margin-top:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      background-image:url('https://cdn-icons-png.flaticon.com/512/747/747310.png');
      background-size:20px;background-position:95% center;background-repeat:no-repeat;
    }
    #startDate:hover,#endDate:hover{border-color:var(--blue-1);background:#fff}
    #startDate:focus,#endDate:focus{
      outline:none;border-color:var(--blue-1);
      background:#fff;box-shadow:0 0 8px rgba(0,123,255,0.4)
    }
    .flatpickr-day.flatpickr-disabled{
      background:var(--danger) !important;color:#fff !important;
      border-radius:6px;opacity:1 !important;cursor:not-allowed
    }
    .flatpickr-day:hover{background:var(--blue-1) !important;color:#fff !important;border-radius:6px}
    .flatpickr-calendar{
      animation:fadeIn .25s ease-out;
      border-radius:12px !important;
      box-shadow:0 8px 25px rgba(0,0,0,0.15) !important
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    #total{margin-top:20px;font-size:18px;font-weight:bold;color:var(--accent);text-align:center}
    button{
      margin-top:25px;padding:12px 20px;
      background:var(--accent);color:#fff;border:none;
      border-radius:8px;cursor:pointer;font-size:16px;
      display:block;margin-left:auto;margin-right:auto;
    }
    button:hover{background:#218838}
    .back{
      margin-top:15px;display:block;text-align:center;
      color:var(--blue-1);text-decoration:none;font-size:14px;
    }
    .back:hover{text-decoration:underline}
    .car-image{
      width:100%;height:220px;object-fit:cover;
      border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }
    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .meta-item{background:#fff;padding:8px;border-radius:8px;border:1px solid #eef2ff}
    @media(max-width:700px){
      .car-info{grid-template-columns:1fr}
      .car-image{height:160px}
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Loading Screen -->
    <div id="loadingMsg" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:20px;">
      <div style="width:60px;height:60px;border:5px solid #e0e0e0;border-top:5px solid #007bff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="font-size:18px;color:#007bff;font-weight:600;margin:0;">Loading car info...</p>
    </div>

    <!-- Car Content -->
    <div id="carContent" style="display:none;">
      <h1 id="carTitle">Book Car</h1>
      <p id="carPrice" style="text-align:center;"></p>

      <div class="car-info" id="carDetails"></div>

      <label for="startDate">Start Date:</label>
      <div class="date-input-wrapper">
        <input id="startDate" placeholder="Select start date" readonly>
      </div>

      <label for="endDate">End Date:</label>
      <div class="date-input-wrapper">
        <input id="endDate" placeholder="Select end date" readonly>
      </div>

      <div id="total">Total Price: $0</div>
      <button id="bookBtn">Request Booking</button>
      <a href="customer.html" class="back">← Back to Dashboard</a>
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const carName = params.get("name");

    if (!carName) {
      document.body.innerHTML = `
        <div style="padding:40px;text-align:center">
          <h2>Car not found</h2>
          <p><a href="customer.html">Back to dashboard</a></p>
        </div>`;
      throw new Error("Missing car name");
    }

    const carTitleEl = document.getElementById("carTitle");
    const carPriceEl = document.getElementById("carPrice");
    const carDetailsEl = document.getElementById("carDetails");
    const startInput = document.getElementById("startDate");
    const endInput = document.getElementById("endDate");
    const totalEl = document.getElementById("total");
    const bookBtn = document.getElementById("bookBtn");

    let car = null;
    let disabledDates = [];
    let startPicker, endPicker;

    function initFirestore() {
      if (typeof db !== "undefined") {
        loadCarFromFirestore();
      } else {
        setTimeout(initFirestore, 300);
      }
    }

    async function loadCarFromFirestore() {
      try {
        const snap = await db.collection("cars")
          .where("name", "==", decodeURIComponent(carName))
          .limit(1)
          .get();

        if (snap.empty) {
          document.body.innerHTML = `
            <div style="padding:40px;text-align:center">
              <h2>Car not found</h2>
              <p><a href="customer.html">Back to dashboard</a></p>
            </div>`;
          return;
        }

        car = snap.docs[0].data();
        renderCarInfo();
        listenBookingsRealtime();
        initPickers();

      } catch (err) {
        console.error("Error loading car:", err);
      }
    }

    function renderCarInfo() {
      carTitleEl.innerText = "Book " + car.name;
      carPriceEl.innerText = "Price per day: $" + car.pricePerDay;

      carDetailsEl.innerHTML = `
        <div>
          <img class="car-image"
            src="${car.image?.exterior?.startsWith('http') ? car.image.exterior : '../' + (car.image?.exterior || 'image/placeholder.jpg')}"
            alt="${car.name}"
            loading="lazy"
            onerror="this.onerror=null;this.src='../image/placeholder.jpg'">
        </div>
        <div>
          <div class="meta-grid">
            <div class="meta-item"><strong>Engine:</strong><div>${car.engine || '-'}</div></div>
            <div class="meta-item"><strong>Fuel Type:</strong><div>${car.fuel || '-'}</div></div>
            <div class="meta-item"><strong>Year:</strong><div>${car.year || '-'}</div></div>
            <div class="meta-item"><strong>Seats:</strong><div>${car.seats || '-'}</div></div>
          </div>
        </div>
      `;
     
      document.querySelector('.car-info').insertAdjacentHTML('afterend', `
    <p style="
      text-align:center;
      margin-top:15px;
      font-size:14px;
      color:#666;
      background:#f0f4ff;
      padding:10px;
      border-radius:8px;
      border-left:4px solid #007bff;
    ">
      💬 For more information about this car, ask our 
      <strong style="color:#007bff;">chatbot</strong> on the 
      <a href="customer.html" style="color:#007bff;">dashboard</a>!
    </p>
  `);

      document.getElementById("loadingMsg").style.display = "none";
      document.getElementById("carContent").style.display = "block";
    }

    function bookingsToDisabledDates(bookings) {
      const dates = new Set();
      bookings.forEach(b => {
        let s = new Date(b.start);
        let e = new Date(b.end);
        for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
          dates.add(d.toISOString().split("T")[0]);
        }
      });
      return Array.from(dates);
    }

    function listenBookingsRealtime() {
      db.collection("bookings")
        .where("carName", "==", decodeURIComponent(carName))
        .onSnapshot(snapshot => {
          const bookings = [];
          snapshot.forEach(doc => bookings.push(doc.data()));
          disabledDates = bookingsToDisabledDates(bookings);
          updatePickersDisabledDates();
        });
    }

    function initPickers() {
      startPicker = flatpickr("#startDate", {
        dateFormat: "Y-m-d",
        minDate: "today",
        disable: disabledDates,
        onChange: function(selectedDates, dateStr) {
          endPicker.set("minDate", dateStr || "today");
          calculateTotal();
        }
      });

      endPicker = flatpickr("#endDate", {
        dateFormat: "Y-m-d",
        minDate: "today",
        disable: disabledDates,
        onChange: calculateTotal
      });
    }

    function updatePickersDisabledDates() {
      if (startPicker) startPicker.set("disable", disabledDates);
      if (endPicker) endPicker.set("disable", disabledDates);
    }

    function calculateTotal() {
      const startVal = startInput.value;
      const endVal = endInput.value;

      if (!startVal || !endVal) { totalEl.innerText = "Total Price: $0"; return; }

      const s = new Date(startVal);
      const e = new Date(endVal);

      if (e < s) { totalEl.innerText = "Total Price: $0"; return; }

      const days = Math.round((e - s) / (1000 * 60 * 60 * 24)) + 1;
      totalEl.innerText = "Total Price: $" + (days * car.pricePerDay);
    }

    async function bookCar() {
      const start = startInput.value;
      const end = endInput.value;

      if (!start || !end) { alert("Please select both start and end dates."); return; }

      const loggedUser = JSON.parse(localStorage.getItem("loggedInUser"));
      if (!loggedUser || !loggedUser.email) { alert("You must be logged in."); return; }

      const days = Math.round((new Date(end) - new Date(start)) / (1000 * 60 * 60 * 24)) + 1;
      const total = days * car.pricePerDay;

      try {
        await db.collection("bookings").add({
          user: loggedUser.name || loggedUser.email,
          email: loggedUser.email,
          carId: decodeURIComponent(carName),
          carName: car.name,
          start, end, total,
          status: "pending",
          createdAt: Date.now()
        });

        await db.collection("notifications").add({
          type: "booking_request",
          userEmail: loggedUser.email,
          carName: car.name,
          start, end,
          message: `New booking request from ${loggedUser.email} for ${car.name} from ${start} to ${end}. Total: $${total}`,
          status: "unread",
          for: "admin",
          createdAt: Date.now()
        });

        alert(`Booking request sent for ${car.name} from ${start} to ${end}. Total: $${total}`);
        startPicker.clear();
        endPicker.clear();
        calculateTotal();

      } catch (err) {
        console.error("Booking failed:", err);
        alert("Booking failed. Try again.");
      }
    }

    bookBtn.addEventListener("click", bookCar);
    initFirestore();
  </script>
</body>
</html>
